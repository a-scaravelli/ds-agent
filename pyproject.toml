[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggle-agent"
version = "0.1.0"
description = "Data science agent for tabular Kaggle competitions (design and skeleton)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kaggle==2.2.4",
    "pandas==3.0.6",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "flask==3.1.3",
    "xgboost==3.4.1",
    "lightgbm==4.7.0",
    "catboost==1.2.10",
    # kaggle==2.2.4 imports `six` at import time (kaggle/models/upload_file.py)
    # but does not declare it, so `import kaggle` fails in a clean virtualenv
    "six==1.17.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kaggle_agent.web" = ["templates/*.html", "static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
